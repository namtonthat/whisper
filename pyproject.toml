[project]
name = "whisper-transcriber"
version = "0.1.0"
description = "Audio transcription tool using OpenAI Whisper"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai-whisper",
    "pre-commit>=4.2.0",
    "rich>=14.0.0",
    "ruff>=0.11.13",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pre-commit",
]

[tool.ruff]
target-version = "py312"
line-length = 88
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
